# 安防智能体 V1.0 · Streamlit 主题
# 工单编号：CV专高5-11（工单 03 - 任务 7）
#
# 配色取向：浅色专业后台（参考 GitHub Light / Ant Design）
# 白底 + 中性灰边框 + 单一蓝色强调，界面干净、打印友好。

[theme]
base = "light"
primaryColor = "#0969da"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1f2328"
font = "sans serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
