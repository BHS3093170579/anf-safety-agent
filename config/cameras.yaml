# 摄像头与 ROI 配置
#
# 每个摄像头一个条目。source 支持三种写法：
#   "rtsp://user:pass@192.168.1.10:554/stream1"   实时流（支持环境变量覆盖）
#   "datasets/videos/helmet/demo.mp4"             本地文件（相对项目根目录）
#   0                                             本机摄像头序号
#
# ROI 多边形坐标一律归一化到 [0,1]，与分辨率无关：
#   [[x1,y1], [x2,y2], ...]  按顺时针顺序，内部用 cv2.pointPolygonTest 判定
#
# source 支持环境变量：${CAM01_URL}，写法 ${VAR:默认值}
# 建议把真实地址写进环境变量或 .env，不要把带账号的地址提交进仓库。

cameras:

  # ----------------------------------------------------------
  # Camera_01 基坑 —— 挖掘机作业区，网线易被施工碰断
  # ----------------------------------------------------------
  Camera_01:
    name: "基坑作业区"
    # 现场网络摄像头：主码流 1280x720，子码流 av0_1 640x480
    source: "${CAM01_URL:rtsp://user:pass@192.168.1.101:554/av0_0}"
    enabled: true
    # 该路目标帧率，与 system.yaml 的 stream.target_fps 取小值生效
    target_fps: 5
    # 断线重连策略：按 system.yaml 的 stream.reconnect_delays
    reconnect: true
    scene: ["helmet", "fall", "fire"]
    # 危险区 ROI
    # 下边界取 1.00 而不是 0.95：判定用的是脚底点，监控画面里前景工人的脚
    # 通常压在画面最底部（实测 y≈0.996），卡 0.95 会把近处的人全部判成
    # 「不在 ROI 内」。
    roi:
      - name: "基坑边缘危险区"
        polygon: [[0.10, 0.55], [0.62, 0.55], [0.70, 1.00], [0.06, 1.00]]
      - name: "挖掘机回转半径"
        polygon: [[0.55, 0.40], [0.95, 0.40], [0.98, 1.00], [0.58, 1.00]]

  # ----------------------------------------------------------
  # Camera_02 施工大门 —— 人员进出，必须保持 5FPS 不中断
  # ----------------------------------------------------------
  Camera_02:
    name: "施工大门"
    # 现场网络摄像头：主码流 2304x1296，子码流 av0_1 640x480
    source: "${CAM02_URL:rtsp://user:pass@192.168.1.102:554/av0_0}"
    enabled: true
    target_fps: 5
    reconnect: true
    scene: ["helmet", "fire"]
    roi:
      - name: "门口通行区"
        polygon: [[0.15, 0.30], [0.88, 0.30], [0.92, 0.98], [0.10, 0.98]]

  # ----------------------------------------------------------
  # Camera_03 值班室 —— 离岗 + 睡岗
  # ----------------------------------------------------------
  Camera_03:
    name: "值班室"
    source: "${CAM03_URL}"
    enabled: true
    target_fps: 5
    reconnect: true
    scene: ["away", "sleep"]
    roi:
      - name: "值班桌面"
        polygon: [[0.30, 0.35], [0.75, 0.35], [0.78, 0.92], [0.28, 0.92]]
        # 离岗检测用：这个区域内累计无人达到阈值即告警
        purpose: "away"

  # ----------------------------------------------------------
  # Camera_04 大门内侧 —— 徘徊（停留 / 折返）
  # ----------------------------------------------------------
  Camera_04:
    name: "大门内侧徘徊区"
    source: "${CAM04_URL}"
    enabled: true
    target_fps: 5
    reconnect: true
    scene: ["loiter"]
    roi:
      - name: "门口警戒区"
        polygon: [[0.12, 0.28], [0.90, 0.28], [0.94, 0.98], [0.08, 0.98]]
        # 徘徊判定用：只在这个区域内累计停留 / 折返
        purpose: "loiter"

# ============================================================
# 默认回退：现场没有 RTSP 时用本地视频跑通链路
# ============================================================
fallback:
  enabled: true
  # 当 cameras.*.source 解析为空时，用这里的本地文件顶上
  # 按 docs 说明把自备视频放到对应目录并改文件名
  Camera_01: "datasets/videos/helmet/demo.mp4"
  Camera_02: "datasets/videos/fire/demo.mp4"
  Camera_03: "datasets/videos/sleep/demo.mp4"
  Camera_04: "datasets/videos/loiter/demo.mp4"
